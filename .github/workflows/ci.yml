name: Build & Verify (Vite / Cloudflare Ready)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Remove bun.lock if present
      run: |
        rm -f bun.lock bun.lockb
        echo "Cleaned any bun lockfile"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Type Check & Lint
      run: npm run lint

    - name: Run Tests
      run: npm test

    - name: Build Vite App for Cloudflare
      run: npm run build
